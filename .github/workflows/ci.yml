name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: 0.12.9
  PYTHON_VERSION: 3.12.14
  NODE_VERSION: 22.23.2

jobs:
  backend:
    name: Backend quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check app tests alembic ../evaluation ../scripts/export_openapi.py
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest
      - name: Verify generated OpenAPI is current
        run: |
          uv run --frozen python ../scripts/export_openapi.py
          git diff --exit-code ../docs/openapi.json
      - name: Export locked runtime dependencies
        run: >-
          uv export --frozen --no-dev --no-emit-project --format requirements-txt
          --output-file "$RUNNER_TEMP/backend-requirements.txt"
      - name: Audit locked runtime dependencies
        run: >-
          uv tool run --from pip-audit==2.9.0 pip-audit --strict
          --requirement "$RUNNER_TEMP/backend-requirements.txt"

  frontend:
    name: Frontend quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high

  data:
    name: Deterministic data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python scripts/generate_demo_data.py --output-dir "$RUNNER_TEMP/generated-data"
      - run: python scripts/validate_demo_data.py --data-dir "$RUNNER_TEMP/generated-data"
      - name: Verify checked-in data is reproducible
        run: diff --recursive --unified data "$RUNNER_TEMP/generated-data"

  integration:
    name: PostgreSQL migrations, ingestion, and evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_DB: resolveai
          POSTGRES_USER: resolveai
          POSTGRES_PASSWORD: resolveai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resolveai -d resolveai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RESOLVEAI_DATABASE_URL: postgresql+asyncpg://resolveai:resolveai_ci@127.0.0.1:5432/resolveai
      RESOLVEAI_ENVIRONMENT: test
      RESOLVEAI_KNOWLEDGE_DATA_DIR: ${{ github.workspace }}/data/knowledge
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --extra dev
      - name: Migration roundtrip
        run: |
          uv run --frozen alembic upgrade head
          uv run --frozen alembic downgrade base
          uv run --frozen alembic upgrade head
      - name: Ingest knowledge corpus
        run: uv run --frozen python -m app.rag.ingest
      - name: Run full Phase 9 evaluation
        run: uv run --frozen python ../evaluation/run_eval.py

  images:
    name: Container builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: resolveai-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  compose-smoke:
    name: Fresh Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Start fresh stack
        run: docker compose up --detach --build --wait --wait-timeout 180
      - name: Health, headers, cache, and users
        run: sh scripts/ci-compose-smoke.sh
      - name: Collect Compose logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-smoke-logs
          path: compose.log
          if-no-files-found: ignore
      - name: Remove stack and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  playwright:
    name: Playwright Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start fresh stack
        run: docker compose up --detach --build --wait --wait-timeout 180
      - name: Run Chromium suites against Compose
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: frontend/test-results
          if-no-files-found: ignore
      - name: Collect Compose logs
        if: always()
        run: docker compose logs --no-color > playwright-compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-compose-logs
          path: playwright-compose.log
          if-no-files-found: ignore
      - name: Remove stack and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

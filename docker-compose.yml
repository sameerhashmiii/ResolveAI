name: resolveai

services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resolveai}
      POSTGRES_USER: ${POSTGRES_USER:-resolveai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resolveai_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      RESOLVEAI_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-resolveai}:${POSTGRES_PASSWORD:-resolveai_local}@database:5432/${POSTGRES_DB:-resolveai}
      RESOLVEAI_ENVIRONMENT: ${RESOLVEAI_ENVIRONMENT:-development}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      RESOLVEAI_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-resolveai}:${POSTGRES_PASSWORD:-resolveai_local}@database:5432/${POSTGRES_DB:-resolveai}
      RESOLVEAI_ENVIRONMENT: ${RESOLVEAI_ENVIRONMENT:-development}
      RESOLVEAI_LOG_LEVEL: ${RESOLVEAI_LOG_LEVEL:-INFO}
      RESOLVEAI_SESSION_COOKIE_SECURE: ${RESOLVEAI_SESSION_COOKIE_SECURE:-false}
      RESOLVEAI_AI_MODE: ${RESOLVEAI_AI_MODE:-local_demo}
      RESOLVEAI_AI_TIMEOUT_SECONDS: ${RESOLVEAI_AI_TIMEOUT_SECONDS:-20}
      RESOLVEAI_AI_CONFIDENCE_THRESHOLD: ${RESOLVEAI_AI_CONFIDENCE_THRESHOLD:-0.70}
      RESOLVEAI_LLM_BASE_URL: ${RESOLVEAI_LLM_BASE_URL:-https://api.openai.com/v1}
      RESOLVEAI_LLM_MODEL: ${RESOLVEAI_LLM_MODEL:-}
      RESOLVEAI_LLM_API_KEY: ${RESOLVEAI_LLM_API_KEY:-}
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ingest:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  ingest:
    build:
      context: ./backend
    command: ["python", "-m", "app.rag.ingest"]
    environment:
      RESOLVEAI_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-resolveai}:${POSTGRES_PASSWORD:-resolveai_local}@database:5432/${POSTGRES_DB:-resolveai}
      RESOLVEAI_ENVIRONMENT: ${RESOLVEAI_ENVIRONMENT:-development}
      RESOLVEAI_KNOWLEDGE_DATA_DIR: /data/knowledge
    volumes:
      - ./data:/data:ro
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  postgres_data:
